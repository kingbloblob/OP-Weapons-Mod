plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
}

loom {
	mods {
		"arsenal" {
			sourceSet sourceSets.main
		}
	}
}

// Game tests (src/gametest) live in their own source set and mod, so they never ship in the release jar.
// Run them with ./gradlew runGameTest.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "arsenal-gametest"
		enableClientGameTests = false
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The One Piece Mod. Arsenal reads its Haki, Devil Fruit, seastone and bounty systems,
	// and its sword grades and whetstones work on Arsenal katanas.
	// It isn't on a maven, so build it and copy the jar into libs/ (see README).
	implementation files("libs/${project.onepiece_jar}")
	gametestImplementation files("libs/${project.onepiece_jar}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}
